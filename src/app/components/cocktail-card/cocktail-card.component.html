<mat-card class="cocktail-card" [class.favorite]="isFavorite()">
  <!-- Context Menu Button (Top Right) -->
  <button
    mat-icon-button
    [matMenuTriggerFor]="contextMenu"
    class="context-menu-button"
    aria-label="Open context menu"
    (click)="$event.stopPropagation()"
  >
    <mat-icon>more_vert</mat-icon>
  </button>

  <mat-card-header>
    <mat-card-title>
      {{ cocktail.strDrink }}
    </mat-card-title>
    <mat-card-subtitle *ngIf="cocktail.strCategory">
      {{ cocktail.strCategory }}
      <span *ngIf="cocktail.strAlcoholic"> • {{ cocktail.strAlcoholic }}</span>
    </mat-card-subtitle>
  </mat-card-header>

  <img
    mat-card-image
    [src]="cocktail.strDrinkThumb || 'assets/placeholder-cocktail.jpg'"
    [alt]="cocktail.strDrink"
    (click)="onViewDetails()"
    (load)="onImageLoad($event)"
    (error)="onImageError($event)"
    class="cocktail-image"
    [class.loaded]="imageLoaded()"
    loading="lazy"
  />

  <mat-card-content>
    <p class="cocktail-glass" *ngIf="cocktail.strGlass">
      <mat-icon class="glass-icon">local_bar</mat-icon>
      {{ cocktail.strGlass }}
    </p>
  </mat-card-content>

  <mat-card-actions>
    <button mat-button color="primary" (click)="onViewDetails()" aria-label="View cocktail details">
      <mat-icon>visibility</mat-icon>
      View Details
    </button>
    <button
      mat-icon-button
      [color]="isFavorite() ? 'warn' : 'default'"
      (click)="onToggleFavorite()"
      [matTooltip]="isFavorite() ? 'Remove from favorites' : 'Add to favorites'"
      [attr.aria-label]="isFavorite() ? 'Remove from favorites' : 'Add to favorites'"
    >
      <mat-icon>{{ isFavorite() ? 'favorite' : 'favorite_border' }}</mat-icon>
    </button>
  </mat-card-actions>

  <!-- Context Menu -->
  <mat-menu #contextMenu="matMenu">
    <button mat-menu-item (click)="onViewDetails()">
      <mat-icon>visibility</mat-icon>
      <span>View Details</span>
    </button>
    <button mat-menu-item (click)="onToggleFavorite()">
      <mat-icon>{{ isFavorite() ? 'favorite' : 'favorite_border' }}</mat-icon>
      <span>{{ isFavorite() ? 'Remove from' : 'Add to' }} Favorites</span>
    </button>
  </mat-menu>
</mat-card>
