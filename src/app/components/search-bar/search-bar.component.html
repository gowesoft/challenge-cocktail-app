<div class="search-container">
  <mat-form-field appearance="outline" class="search-type-field" subscriptSizing="dynamic">
    <mat-label>Search by</mat-label>
    <mat-select [(value)]="searchTypeSignal" (selectionChange)="onSearchTypeChange()">
      <mat-option value="name">Name</mat-option>
      <mat-option value="ingredient">Ingredient</mat-option>
      <mat-option value="id">ID</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="search-input-field" subscriptSizing="dynamic">
    <mat-label>{{ searchPlaceholder() }}</mat-label>
    <input
      matInput
      [(ngModel)]="searchValueSignal"
      (ngModelChange)="onInputChange()"
      (keyup.enter)="onSearch()"
      [pattern]="inputPattern()"
      [maxlength]="maxLength()"
      [attr.aria-label]="'Search by ' + searchTypeSignal()"
    />
    <button
      mat-icon-button
      matSuffix
      (click)="onClear()"
      *ngIf="searchValueSignal().length > 0"
      aria-label="Clear search"
    >
      <mat-icon>close</mat-icon>
    </button>
  </mat-form-field>

  <button
    mat-raised-button
    color="primary"
    (click)="onSearch()"
    [disabled]="!isValid()"
    class="search-button"
    aria-label="Search cocktails"
  >
    <mat-icon>search</mat-icon>
    Search
  </button>

  <button
    mat-raised-button
    color="accent"
    (click)="onClearAll()"
    *ngIf="hasActiveSearch()"
    class="clear-all-button"
    aria-label="Clear all filters"
  >
    <mat-icon>refresh</mat-icon>
    Clear Filters
  </button>
</div>
